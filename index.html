<!DOCTYPE html>
<html>
<head>
    <title>Система оптимизации маршрутов мусоровозов</title>
    <meta charset="utf-8">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=96e743d5-27fa-4294-b2f6-f03eea5bdfd4&lang=ru_RU"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
</head>
<body>
    <div id="menu-overlay"></div>
    <button id="menu-toggle"><i class="fas fa-bars"></i></button>
    <div id="menu">
        <div class="menu-header">
            <h2>Мусорные контейнеры</h2>
            <span class="counter" id="counter">0</span>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="save-btn">
                <i class="fas fa-save"></i> Сохранить
            </button>
            <button class="btn btn-secondary" id="load-btn">
                <i class="fas fa-folder-open"></i> Загрузить
            </button>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-danger" id="clear-btn">
                <i class="fas fa-trash-alt"></i> Очистить
            </button>
            <button class="btn btn-warning" id="optimize-btn">
                <i class="fas fa-route"></i> Оптимизировать
            </button>
        </div>
        <button class="btn btn-secondary" id="analyze-btn">
            <i class="fas fa-chart-line"></i> Анализ
        </button>

        <div id="loading-overlay" style="display: none;">
            <div class="loader-container">
                <div class="loader"></div>
                <div class="progress-text">Идет анализ маршрутов...</div>
                <div class="progress-bar">
                    <div class="progress"></div>
                </div>
            </div>
        </div>

        <div class="route-controls">
            <h3>Параметры маршрута:</h3>
            <div>
                <label for="algorithm-select">Алгоритм маршрутизации:</label>
                <select id="algorithm-select">
                    <option value="gnn">GNN</option>
                    <option value="ant">Муравьиный</option>
                    <option value="genetic">Генетический</option>
                    <option value="clarke">Кларка-Райта</option>
                </select>
            </div>
        </div>
        <div class="stats-container">
            <h3>Статистика маршрута</h3>
            <div id="route-stats">
                <div class="stat-item">
                    <span class="stat-label">Алгоритм:</span>
                    <span class="stat-value" id="algorithm-name">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Длина маршрута:</span>
                    <span class="stat-value" id="distance-value">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Время выполнения:</span>
                    <span class="stat-value" id="execution-time">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label clickable" id="time-label">Общее время маршрута:</span>
                    <span class="stat-value" id="total-time-value">-</span>
                    <div class="time-details" id="time-details" style="display: none;">
                        <div>Движение: <span id="driving-time-value">-</span></div>
                        <div>Разгрузка: <span id="unloading-time-value">-</span></div>
                        <div>Алгоритм: <span id="algorithm-time-value">-</span></div>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Контейнеров:</span>
                    <span class="stat-value" id="containers-count">-</span>
                </div>
            </div>
        </div>


        <div class="legend">
            <div class="legend-item">
                <span class="fill-indicator" style="background: #4CAF50;"></span> Менее 40%
            </div>
            <div class="legend-item">
                <span class="fill-indicator" style="background: #FF9800;"></span> 40-80%
            </div>
            <div class="legend-item">
                <span class="fill-indicator" style="background: #F44336;"></span> Более 80%
            </div>
        </div>
        
        <h3>Список контейнеров:</h3>
        <div class="container-list" id="container-list">
            <div class="no-data">Нет данных</div>
        </div>
    </div>
    <div id="map"></div>

    <script src="js/storage.js"></script>
    <script src="js/map.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/app.js"></script>
    <!-- <script src="js/charts.js"></script> -->
</body>
</html>
