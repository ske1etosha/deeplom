<!DOCTYPE html>
<html>
<head>
    <title>Анализ маршрутов</title>
    <meta charset="utf-8">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=96e743d5-27fa-4294-b2f6-f03eea5bdfd4&lang=ru_RU"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .analysis-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 15px;
            padding: 20px;
        }
        .map-container {
            position: relative;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .map-title {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 100;
            font-weight: 500;
        }
        .summary-panel {
            grid-column: span 2;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
        }
        .metrics-table th, .metrics-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .metrics-table th {
            background: #e9ecef;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .map-container {
            position: relative;
            height: 400px; /* Фиксированная высота */
            width: 100%;
        }

        .analysis-map {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Назад
    </a>
    <div class="analysis-container">
        <div class="map-container">
            <div class="map-title">GNN Оптимизация</div>
            <div id="gnn-map" class="analysis-map"></div>
        </div>
        <div class="map-container">
            <div class="map-title">Муравьиный алгоритм</div>
            <div id="ant-map" class="analysis-map"></div>
        </div>
        <div class="map-container">
            <div class="map-title">Генетический алгоритм</div>
            <div id="genetic-map" class="analysis-map"></div>
        </div>
        <div class="map-container">
            <div class="map-title">Кларка-Райта</div>
            <div id="clarke-map" class="analysis-map"></div>
        </div>
        
        <div class="summary-panel">
            <h2>Сравнение алгоритмов</h2>
            <div class="algorithms-comparison">
                <!-- Блоки будут добавляться динамически -->
            </div>
        </div>
    </div>

    <script src="js/analysis.js"></script>
</body>
</html>
